services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coflow
      POSTGRES_USER: coflow
      POSTGRES_PASSWORD: coflow
    ports:
      - "5432:5432"
    volumes:
      - coflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coflow -d coflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  coflow_postgres_data:
